name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      # Tagged commits only: the module proxy learns of the version here,
      # so `go get` resolves at once.
      - name: Add the module to the proxy
        continue-on-error: true
        run: curl -fsS "https://proxy.golang.org/github.com/xiyaowong/flagicons/@v/$GITHUB_REF_NAME.info"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "flagicons ${GITHUB_REF_NAME#v}"
