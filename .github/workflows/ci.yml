name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", LICENSE]
  pull_request:
    paths-ignore: ["**/*.md", LICENSE]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Linux has no window system: the ui tests draw on the CPU there,
      # under a virtual display.
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl-mesa0
      - name: Vet every platform
        if: runner.os == 'Linux'
        run: |
          for os in darwin linux windows; do
            GOOS=$os go vet ./...
          done
      - run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
